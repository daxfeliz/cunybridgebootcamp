[project]
name = "get-pokemon-color-palletes"
version = "0.0.7"
description = "A tool to query pokemon sprites and obtain color palletes for any given pokemon."
authors = [
    { name = "Dax Feliz", email = "dfeliz@flatironinstitute.org" }
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "colorthief"
]

[project.license]
file = "LICENSE"

[project.scripts]
# If your package folder is "get_pkmn_color_pallete", this must match:
get-pokemon-palette = "get_pokemon_color_palletes.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend="setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["get_pokemon_color_palletes*"]
